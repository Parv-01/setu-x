[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "setu-x"
version = "0.6.0"
description = "SETU-X: a local-first experimental platform for microservices across heterogeneous (simulated) cloud environments"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Parv Agarwal" }]
# Exact pins for reproducible experiments. The fully resolved set (including transitive
# dependencies) is recorded in requirements/runtime.lock and requirements/dev.lock.
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
  "e2e: end-to-end tests that need the Docker Compose stack running (set SETU_E2E_GATEWAY_URL)",
  "browser: dashboard tests in a real browser (Playwright; set SETU_DASHBOARD_URL; compose profile 'browser')",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["setu_x", "tests"]
