# SETU-X local stack (Phase 4: gateway, controller, inventory-a, inventory-b, pricing).
# Start:  docker compose up --build -d      Stop: docker compose down
# Tests:  docker compose --profile test run --rm tests
# Compatible with Docker Compose v5.1.3 and later.
#
# Environment labels (SETU_ENV) such as "aws-simulated" are SIMULATION LABELS on this Docker
# host. They are not cloud deployments. The authoritative placement (which instance is in which
# environment) is configs/placement.yaml, served by the controller. The SETU_ENV values below must
# match it; a test checks this.

name: setu-x

x-service: &service
  image: setu-x:0.4.0
  build:
    context: .
    target: runtime
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 10s
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 256M
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 15s

x-env: &env
  SETU_MODE: ${SETU_MODE:-local}
  SETU_LOG_LEVEL: ${SETU_LOG_LEVEL:-INFO}

services:
  inventory-a:
    <<: *service
    command: ["python", "-m", "setu_x.services.inventory"]
    environment:
      <<: *env
      SETU_INSTANCE: inventory-a
      SETU_ENV: aws-simulated

  inventory-b:
    <<: *service
    command: ["python", "-m", "setu_x.services.inventory"]
    environment:
      <<: *env
      SETU_INSTANCE: inventory-b
      SETU_ENV: gcp-simulated

  pricing:
    <<: *service
    command: ["python", "-m", "setu_x.services.pricing"]
    environment:
      <<: *env
      SETU_INSTANCE: pricing
      SETU_ENV: azure-simulated

  controller:
    <<: *service
    command: ["python", "-m", "setu_x.services.controller"]
    environment:
      <<: *env
      SETU_INSTANCE: controller
      SETU_ENV: local
      SETU_CONFIG_DIR: /app/configs
      SETU_GATEWAY_URL: http://gateway:8000
    volumes:
      - ./configs:/app/configs:ro
    ports:
      - "127.0.0.1:${CONTROLLER_PORT:-8090}:8000"

  gateway:
    <<: *service
    command: ["python", "-m", "setu_x.services.gateway"]
    environment:
      <<: *env
      SETU_INSTANCE: gateway
      SETU_ENV: local
      SETU_CONFIG_DIR: /app/configs
      SETU_CONTROLLER_URL: http://controller:8000
      SETU_POLL_INTERVAL_MS: ${SETU_POLL_INTERVAL_MS:-2000}
      SETU_RANDOM_SEED: ${SETU_RANDOM_SEED:-}
    volumes:
      - ./configs:/app/configs:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8000"
    depends_on:
      inventory-a:
        condition: service_healthy
      inventory-b:
        condition: service_healthy
      pricing:
        condition: service_healthy
      controller:
        condition: service_healthy

  tests:
    image: setu-x-test:0.4.0
    build:
      context: .
      target: test
    profiles: ["test"]
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SETU_E2E_GATEWAY_URL: http://gateway:8000
      SETU_E2E_CONTROLLER_URL: http://controller:8000
