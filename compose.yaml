# SETU-X local stack (Phase 2: gateway + inventory-a + pricing).
# Start:  docker compose up --build -d      Stop: docker compose down
# Tests:  docker compose --profile test run --rm tests
# Compatible with Docker Compose v5.1.3 and later.
#
# Environment labels (SETU_ENV) such as "aws-simulated" are SIMULATION LABELS on this Docker
# host. They are not cloud deployments.

name: setu-x

x-service: &service
  image: setu-x:0.2.0
  build:
    context: .
    target: runtime
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 10s
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 256M
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 15s

x-env: &env
  SETU_MODE: ${SETU_MODE:-local}
  SETU_LOG_LEVEL: ${SETU_LOG_LEVEL:-INFO}

services:
  inventory-a:
    <<: *service
    command: ["python", "-m", "setu_x.services.inventory"]
    environment:
      <<: *env
      SETU_INSTANCE: inventory-a
      SETU_ENV: aws-simulated

  pricing:
    <<: *service
    command: ["python", "-m", "setu_x.services.pricing"]
    environment:
      <<: *env
      SETU_INSTANCE: pricing
      SETU_ENV: azure-simulated

  gateway:
    <<: *service
    command: ["python", "-m", "setu_x.services.gateway"]
    environment:
      <<: *env
      SETU_INSTANCE: gateway
      SETU_ENV: local
      SETU_INVENTORY_URL: http://inventory-a:8000
      SETU_PRICING_URL: http://pricing:8000
      SETU_CALL_MODE: ${SETU_CALL_MODE:-parallel}
      SETU_TIMEOUT_MS: ${SETU_TIMEOUT_MS:-800}
      SETU_OUTER_DEADLINE_MS: ${SETU_OUTER_DEADLINE_MS:-3000}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8000"
    depends_on:
      inventory-a:
        condition: service_healthy
      pricing:
        condition: service_healthy

  tests:
    image: setu-x-test:0.2.0
    build:
      context: .
      target: test
    profiles: ["test"]
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SETU_E2E_GATEWAY_URL: http://gateway:8000
