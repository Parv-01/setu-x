# Weekly update proposals. Dependency pins are exact on purpose (reproducible experiments),
# so every update arrives as a pull request that CI must pass; nothing updates silently.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
